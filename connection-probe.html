<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>연결 점검</title>
<pre id="status">연결 확인 중</pre>
<script>
const url = 'https://script.google.com/macros/s/AKfycbxtCvuN_ytAs4M769uCuq4kUuXRFFSoyR7QlKuNKQoJjlRnZICVDI-0H4QOTa4NQiC88Q/exec';
async function run() {
  const results = [];
  for (const [label, options] of [
    ['GET', {method:'GET'}],
    ['POST', {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action:'testConnection',params:[]})}]
  ]) {
    try {
      const target = label === 'GET' ? url + '?action=testConnection&params=%5B%5D' : url;
      const response = await fetch(target, options);
      results.push(label + ' ' + response.status + ': ' + await response.text());
    } catch (error) {
      results.push(label + ' 실패: ' + error.name + ': ' + error.message);
    }
    document.querySelector('#status').textContent = results.join('\n');
  }
}
run();
</script></html>
